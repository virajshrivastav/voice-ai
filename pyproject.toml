[project]
name = "voiceai"
version = "0.1.0"
description = "Cloned-voice, two-way constituent outreach calls for MLAs/MPs (Marathi/Hindi)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.22",
    "rich>=13.7",
]

[project.optional-dependencies]
# Stage 1 browser bot. Kept out of the core so stage0 + tests install in seconds.
stage1 = [
    "pipecat-ai[silero,webrtc]>=0.0.60",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bakeoff = "stage0.bakeoff:main"
blindpack = "stage0.blindpack:main"
bakeoff-report = "stage0.report:main"
costmodel = "voiceai.costs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceai", "stage0", "stage1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
